services:
  development:
    build:
      context: ../../
      dockerfile: build/confector-development/dev-container/Dockerfile
    secrets:
      - mongo-readwrite-password
    depends_on:
      - mongo
    volumes:
      # Bind mount host source code
      - ../../.:/code
      - ./config:/etc/confector
      # Mask dev directory to cache dependencies
      - dev-home:/home/dev/
      # Docker socket for container-in-container workflows (if required by tasks)
      - /var/run/docker.sock:/var/run/docker.sock
    # Build output is temporary, and binaries must be executable from this mount.
    tmpfs:
      - /code/bin:rw,exec,mode=0777
    environment:
      - DUB_CACHE_DIR=/home/dev/.dub

  mongo:
    image: mongo
    restart: always
    secrets:
      - mongo-admin-password
      - mongo-readwrite-password
    volumes:
      - ./mongo/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    secrets:
      - mongo-admin-password
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_AUTH_USERNAME: dev
      ME_CONFIG_MONGODB_AUTH_PASSWORD_FILE: /run/secrets/mongo-admin-password
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      #ME_CONFIG_MONGODB_SERVER: mongo
      MONGO_INITDB_DATABASE: confector

  proxy:
    build: proxy
    ports:
      - 8080:80
    depends_on:
      - development

secrets:
  mongo-admin-password:
    file: mongo/dev-admin-password.txt
  mongo-readwrite-password:
    file: mongo/dev-readwrite-password.txt

volumes:
  dev-home:
  mongo-data:
